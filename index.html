<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Development To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Weekly Skill Goals</h1>
    <ul class="todo-list">
      <li>
        <input type="checkbox" id="task-1">
        <label for="task-1">Master CSS Grid Layouts</label>
        <ul class="sub-item">
          <li>
            <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Grid_Layout" class="sub-item-link" target="_blank">MDN Grid Guide</a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="task-2">
        <label for="task-2">Build Responsive Navbars</label>
        <ul class="sub-item">
          <li>
            <a href="https://css-tricks.com/snippets/css/a-guide-to-flexbox/" class="sub-item-link" target="_blank">Flexbox Cheat Sheet</a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="task-3">
        <label for="task-3">Understand Pseudo-classes</label>
        <ul class="sub-item">
          <li>
            <a href="https://freecodecamp.org" class="sub-item-link" target="_blank">freeCodeCamp Practice</a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="task-4">
        <label for="task-4">Publish GitHub Repositories</label>
        <ul class="sub-item">
          <li>
            <a href="https://github.com" class="sub-item-link" target="_blank">GitHub Dashboard</a>
          </li>
        </ul>
      </li>
    </ul>
  </main>
</body>
</html>
